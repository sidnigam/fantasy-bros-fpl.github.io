name: Update FPL site

on:
  schedule:
    # Daily 07:00 UTC — after Monday-night matches + bonus/data confirmation.
    # update.py is a no-op unless a new gameweek has finished since the last build.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data if a gameweek has completed
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Update FPL data ($(date -u +%Y-%m-%d))"
            git push
          fi

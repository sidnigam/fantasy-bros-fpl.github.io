name: Update FPL site

on:
  schedule:
    # Every 12h (00:00 & 12:00 UTC). update.py rebuilds when a gameweek has
    # finished since the last build, or when one is currently in progress
    # (provisional "GW N so far" numbers). Between gameweeks it's a no-op and
    # produces no commit. Twice-daily keeps the lag small when FPL finalises a
    # gameweek (and absorbs GitHub's scheduled-run delivery delay).
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh data if a gameweek has completed
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Update FPL data ($(date -u +%Y-%m-%d))"
            git push
          fi
